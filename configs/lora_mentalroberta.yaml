# Experiment: MentalRoBERTa + LoRA (rank=8) + Focal Loss + Label Smoothing
# This is the PRIMARY experiment — expected best result.
# Run this LAST after all baselines are established.

experiment_name: "mental_roberta_lora_r8_focal_smooth"

# ── Data (inherited from base) ────────────────────────
data:
  path: "data/processed/mental_health_cleaned.csv"
  text_col: "text"
  label_col: "status"

max_length: 256

# ── Model ─────────────────────────────────────────────
model:
  key: "mental-roberta"    # Resolves to mental/mental-roberta-base
  use_lora: true
  lora_rank: 8
  dropout: 0.1

# ── Training ──────────────────────────────────────────
training:
  epochs: 5
  batch_size: 16
  learning_rate: 3.0e-4    # Higher LR for LoRA (only adapters update)
  weight_decay: 0.01
  warmup_ratio: 0.1
  loss: "focal_smooth"
  focal_gamma: 2.0
  label_smoothing: 0.1

seed: 42
use_wandb: false
