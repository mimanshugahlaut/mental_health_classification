# Experiment: BERT-base Full Fine-Tuning (your old paper's approach — the floor)
# Run this FIRST to establish the baseline to beat.

experiment_name: "bert_base_full_ft_ce"

data:
  path: "data/processed/mental_health_cleaned.csv"
  text_col: "text"
  label_col: "status"

max_length: 256

model:
  key: "bert"              # Resolves to bert-base-uncased
  use_lora: false          # Full fine-tuning
  dropout: 0.1

training:
  epochs: 5
  batch_size: 16
  learning_rate: 2.0e-5   # Standard BERT fine-tuning LR
  weight_decay: 0.01
  warmup_ratio: 0.1
  loss: "ce"               # Standard CE — replicates your old paper's setup
  focal_gamma: 2.0
  label_smoothing: 0.1

seed: 42
use_wandb: false
